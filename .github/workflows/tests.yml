name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: SALT-NLP/RealtimeGym
          ref: 3d5b3ef37dafee25ca2e8d2e8d71f5fe842eda7b
          path: .cache/realtimegym
          persist-credentials: false
      - run: pip install -e '.[test,games,paper]'
      - run: pip install --no-deps -e .cache/realtimegym
      - run: python -m pytest --cov=diagnose --cov-report=term-missing
      - run: ruff check diagnose tests scripts paper
      - name: Replay published evidence
        if: ${{ hashFiles('results/review/archive.json') != '' }}
        run: python scripts/check_evidence.py results/review

      - name: Replay follow-up evidence
        if: ${{ hashFiles('results/review-overnight/archive.json') != '' }}
        run: python scripts/check_evidence.py results/review-overnight
